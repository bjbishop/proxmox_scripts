---
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: local
    hooks:
      - id: validate_answer_file
        name: validate proxmox answer.toml
        language: system
        entry: podman-compose run --rm --entrypoint /bin/bash pve -c 'proxmox-auto-install-assistant validate-answer /tmp/proxmox/answer.toml'
        files: ^answer\.toml$
        pass_filenames: false
-   repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      -   id: shellcheck
# Try to detect password hashes in the older, less secure sha512 format, and prefer the yescrypt formta.
# A simple grep-based hook to pass when the string '$6$' is absent. This could have a false positive on something unrelated
-   repo: local
    hooks:
      - id: mkpasswd_yescrypt_replaces_sha512
        name: reject SHA512 password hashes
        language: system
        entry: bash -c 'grep -nHF "$1" "${@:2}"; result=$?; test "$result" -eq 1' -- '$6$'
        exclude: ^\.pre-commit-config\.yaml$
