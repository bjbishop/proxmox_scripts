# https://pve.proxmox.com/wiki/Automated_Installation#Answer_File_Format_2

[global]
keyboard = "en-us"
country = "us"
fqdn = "optiplex.internal"
mailto = "bbishop@fastmail.com"
timezone = "America/Chicago"
root-ssh-keys = [
    "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILi1okhO4blKf8zlxJORtFop64FZXtfD9ja3GHqsWObY"
]
# $y means yescrypt, which replaced sha512 in 2021.  use mkpasswd to generate this
root-password-hashed = "$y$j9T$rnPFcwFaC7U9Z7x2UPRrg0$Hix.3foZ6p3BaLLDX3LECDmq8Dzvj9MLXf5ycDR7mQ1"

[network]
source = "from-answer"
cidr = "192.168.0.10/24"
dns = "8.8.8.8"
gateway = "192.168.0.1"

# This is to just format the main system volume for where proxmox is going to live, not the other attached disks.
[disk-setup]
filesystem = "ext4"
lvm.swapsize = 12

# qemu disks
# filter.ID_PATH = "pci-0000_04_00_0"
# or
# disk-list = ["/dev/vda"]
#
# for real hardware
filter.ID_SERIAL_SHORT = "0036580001504"

[first-boot]
source = "from-iso"
