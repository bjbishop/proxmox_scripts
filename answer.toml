[network]
source = "from-dhcp"

# This is to just format the main system volume for where proxmox is going to live, not the other attached disks.
[disk-setup]
filesystem = "ext4"
lvm.swapsize = 12

# qemu disks
filter.ID_PATH = "pci-0000_04_00_0"
# or
# disk-list = ["/dev/vda"]
#
# for real hardware
# filter.ID_SERIAL_SHORT = "0036580001504"

[first-boot]
source = "from-iso"

